<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero">
        <p class="brand">Project Launcher</p>
        <h1>一项目一开关</h1>
        <p class="sub">用系统文件夹选择器添加项目集合或单个项目，再开关启停。</p>
        <div class="toolbar">
          <label class="search">
            <span class="sr-only">搜索项目</span>
            <input id="search" type="search" placeholder="搜索项目…" autocomplete="off" />
          </label>
          <button type="button" class="ghost" id="manage-watch" title="添加或管理监听目录">
            选择监听
          </button>
          <button type="button" class="ghost" id="restart-running" disabled title="重启当前已启动的项目">
            重启运行中
          </button>
          <div class="meta" id="meta">加载中…</div>
        </div>
      </header>

      <section class="board" id="board" aria-live="polite"></section>

      <dialog id="watch-dialog">
        <div class="dialog-body">
          <h3>选择监听</h3>
          <p class="dialog-hint">通过系统文件夹选择器添加：项目集合目录，或单个项目目录。</p>
          <div class="pick-actions">
            <button type="button" class="ghost primary" id="pick-collection">选择项目集合目录</button>
            <button type="button" class="ghost primary" id="pick-project">选择单个项目</button>
          </div>
          <div class="source-block">
            <p class="source-title">已添加</p>
            <div class="watch-list" id="watch-list"></div>
          </div>
          <div class="dialog-actions">
            <button type="button" class="ghost" id="watch-close">完成</button>
          </div>
        </div>
      </dialog>

      <dialog id="cmd-dialog">
        <div class="dialog-body">
          <h3 id="cmd-dialog-title">命令设置</h3>
          <p class="dialog-hint">设置主开关默认命令，并管理「其他命令」快捷入口。</p>

          <label class="field">
            <span>默认命令</span>
            <select id="cmd-default"></select>
          </label>
          <label class="field">
            <span>或自定义默认命令</span>
            <input id="cmd-default-custom" type="text" placeholder="例如：npm run build:mp" autocomplete="off" />
          </label>

          <div class="source-block">
            <p class="source-title">其他快捷命令</p>
            <div class="cmd-shortcut-list" id="cmd-shortcut-list"></div>
            <div class="cmd-add-row">
              <select id="cmd-add-select"></select>
              <input id="cmd-add-custom" type="text" placeholder="或输入自定义命令" autocomplete="off" />
              <button type="button" class="ghost compact" id="cmd-add-btn">添加</button>
            </div>
          </div>

          <div class="dialog-actions">
            <button type="button" class="ghost" id="cmd-cancel">取消</button>
            <button type="button" class="ghost primary" id="cmd-save">保存</button>
          </div>
        </div>
      </dialog>

      <aside class="drawer" id="drawer" hidden>
        <div class="drawer-head">
          <div>
            <p class="drawer-label">运行日志</p>
            <h2 id="drawer-title">—</h2>
          </div>
          <button type="button" class="ghost" id="drawer-close">关闭</button>
        </div>
        <pre id="logs" class="logs"></pre>
      </aside>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
